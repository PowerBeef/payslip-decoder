/* ================= tokens ================= */
:root {
  color-scheme: light;
  --paper: #edf2f0; --sheet: #ffffff; --sheet-2: #f4f7f6; --mint: #d3e8de;
  --ink: #13233a; --ink-2: #44546a; --ink-3: #5f6f83;
  --rule: #dae3df; --rule-2: #c0ccc7;
  --guil: rgba(27, 127, 85, 0.16); --guil-2: rgba(42, 120, 214, 0.10);
  --focus: #2a78d6; --link: #1d5fae;
  --s-net: #1b7f55; --s-tax: #2a78d6; --s-gov: #e0663a; --s-pen: #7a5bd6; --s-ben: #e3a21a; --on-net: #ffffff;
  --h1: #24405f; --h2: #5a7391; --h3: #95a8bd; --h4: #c5d0dc;
  --good: #0a7d2c; --good-bg: #e3f3e7; --warn: #a65f00; --warn-bg: #fcefd8; --info: #44546a; --info-bg: #eaeff3;
  --hl: #fff1b8;
  --shadow: 0 1px 0 rgba(19, 35, 58, .05), 0 10px 28px -14px rgba(19, 35, 58, .22);
  --shadow-lg: 0 18px 40px -16px rgba(19, 35, 58, .35), 0 2px 6px rgba(19, 35, 58, .08);
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  --card-sh: 0 1px 2px rgba(19, 35, 58, .04), 0 8px 22px -16px rgba(19, 35, 58, .2);
  --thumb: #ffffff;
  --bar-h: 57px;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-ios: cubic-bezier(.32, .72, 0, 1);
  --spring: cubic-bezier(.34, 1.36, .64, 1);
}
@media screen {
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #0f171f; --sheet: #18222d; --sheet-2: #1f2a36; --mint: #1d3a30;
    --ink: #e8eef0; --ink-2: #b4c1c9; --ink-3: #91a0ad;
    --rule: #2a3744; --rule-2: #3b4a58;
    --guil: rgba(34, 152, 95, 0.20); --guil-2: rgba(57, 135, 229, 0.12);
    --focus: #6aa8f0; --link: #8cbcf5;
    --s-net: #22985f; --s-tax: #3987e5; --s-gov: #d95926; --s-pen: #9085e9; --s-ben: #c98500; --on-net: #04140c;
    --h1: #c4d3e2; --h2: #8ea3b8; --h3: #5f758b; --h4: #44576b;
    --good: #5ccf7a; --good-bg: #163021; --warn: #f0b24a; --warn-bg: #362a10; --info: #b4c1c9; --info-bg: #23303d;
    --hl: #3d3716;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.65);
    --shadow-lg: 0 18px 40px -12px rgba(0,0,0,.7);
    --card-sh: inset 0 1px 0 rgba(255,255,255,.03);
    --thumb: #3a4958;
  }
}
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0f171f; --sheet: #18222d; --sheet-2: #1f2a36; --mint: #1d3a30;
    --ink: #e8eef0; --ink-2: #b4c1c9; --ink-3: #91a0ad;
    --rule: #2a3744; --rule-2: #3b4a58;
    --guil: rgba(34, 152, 95, 0.20); --guil-2: rgba(57, 135, 229, 0.12);
    --focus: #6aa8f0; --link: #8cbcf5;
    --s-net: #22985f; --s-tax: #3987e5; --s-gov: #d95926; --s-pen: #9085e9; --s-ben: #c98500; --on-net: #04140c;
    --h1: #c4d3e2; --h2: #8ea3b8; --h3: #5f758b; --h4: #44576b;
    --good: #5ccf7a; --good-bg: #163021; --warn: #f0b24a; --warn-bg: #362a10; --info: #b4c1c9; --info-bg: #23303d;
    --hl: #3d3716;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.65);
    --shadow-lg: 0 18px 40px -12px rgba(0,0,0,.7);
    --card-sh: inset 0 1px 0 rgba(255,255,255,.03);
    --thumb: #3a4958;
  }
}

/* ================= base ================= */
/* safe areas; set to 0 by script when the host app already keeps the page clear of the status bar / home bar */
:root { --sa-top: env(safe-area-inset-top, 0px); --sa-bottom: env(safe-area-inset-bottom, 0px); }
html.host-top { --sa-top: 0px; }
html.host-bottom { --sa-bottom: 0px; }
#file { top: 0; left: 0; }
#sa-probe { position: absolute; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; overflow-x: clip; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
p { margin: 0; }
a { color: var(--link); text-underline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
body.private .pii { filter: blur(6px); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ================= shell ================= */
.app { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr; grid-template-areas: "bar" "tabs" "main"; }
.bar { grid-area: bar; position: sticky; top: 0; z-index: 30; padding-top: var(--sa-top); background: var(--paper); border-bottom: 1px solid transparent; transition: background-color .3s var(--ease-out), border-color .3s var(--ease-out); }
body.scrolled .bar { background: color-mix(in srgb, var(--paper) 80%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border-bottom-color: color-mix(in srgb, var(--ink) 8%, transparent); }
#top-sentinel { position: absolute; top: 0; left: 0; width: 1px; height: 4px; pointer-events: none; }
.bar-in { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 21px/1 var(--f-cond); letter-spacing: .1px; white-space: nowrap; }
.brand svg { flex: none; }
.bar-slip { flex: 1; min-width: 0; display: flex; }
.bar-tools { display: flex; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ex { background: var(--hl); color: var(--ink); }
.slipd { font-weight: 600; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.picker { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.picker select { appearance: none; -webkit-appearance: none; font: 600 15px var(--f-body); border: 1px solid var(--rule-2); background: var(--sheet); border-radius: 999px; padding: 0 34px 0 14px; height: 40px; color: var(--ink); max-width: 100%; cursor: pointer; }
.picker svg { position: absolute; right: 12px; width: 14px; height: 14px; transform: rotate(90deg); pointer-events: none; color: var(--ink-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 0 16px; min-height: 40px; font-weight: 600; font-size: 15px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--s-net); border-color: transparent; color: var(--on-net); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 6px 16px -10px color-mix(in srgb, var(--s-net) 80%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.soft { background: var(--sheet); border-color: color-mix(in srgb, var(--ink) 9%, transparent); box-shadow: var(--card-sh); }
.btn.soft:hover { background: color-mix(in srgb, var(--ink) 4%, var(--sheet)); }
.btn.xl { min-height: 56px; font-size: 17px; padding: 0 26px; gap: 10px; }
.btn.xl svg { width: 21px; height: 21px; }
.btn[disabled] { cursor: progress; opacity: .85; }
.btn.primary .spin { border-color: color-mix(in srgb, var(--on-net) 35%, transparent); border-top-color: var(--on-net); }
/* press feedback: a quick shrink, like a native control */
.btn, .iconbtn, .seg button, .subnav button, .act, .segc button, .sh-pick button { transition: transform .2s var(--ease-out), background-color .2s, color .2s, filter .2s; }
.btn:active:not([disabled]), .iconbtn:active, .subnav button:active, .sh-pick button:active { transform: scale(.97); }
.act:active { transform: scale(.985); }
.tab:active .ti svg { transform: scale(.88); transition-duration: .1s; }
.btn.ghost { background: transparent; }
.btn .l-s { display: none; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule-2); background: var(--sheet); display: grid; place-items: center; cursor: pointer; padding: 0; color: var(--ink); }
.iconbtn svg { width: 20px; height: 20px; }

.codes { margin-top: 16px; }

.sh-steps li::before { content: counter(s); grid-row: span 2; width: 30px; height: 30px; border-radius: 50%; background: var(--s-net); color: var(--on-net); display: grid; place-items: center; font: 700 16px/1 var(--f-cond); }

/* ================= welcome ================= */
.main > .welcome { max-width: 1100px; }
body.at-rest .main { display: flex; flex-direction: column; }
body.at-rest .main > * { width: 100%; }
.welcome { flex: 1 0 auto; display: grid; gap: 26px; align-content: center; grid-template-areas: "art" "copy"; padding: 4px 0 8px; }
.wl-art { grid-area: art; position: relative; isolation: isolate; padding: 6px 4px 0; }
.wl-art::before { content: ''; position: absolute; inset: -12% 0 -4%; z-index: -1; background: radial-gradient(closest-side, color-mix(in srgb, var(--s-net) 16%, transparent), transparent); }
.wl-stub { position: relative; overflow: hidden; max-width: 360px; margin: 0 auto; background: var(--sheet); border-radius: 24px; padding: 16px 18px 18px; box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 6%, transparent), 0 24px 48px -24px rgba(10, 20, 32, .38), 0 2px 8px -2px rgba(10, 20, 32, .08); }
.wl-stub > :not(.guil) { position: relative; }
.wl-top { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--f-cond); color: var(--ink-2); }
.wl-top svg { width: 28px; height: 28px; flex: none; }
.wl-rows { list-style: none; margin: 10px 0 14px; padding: 0; }
.wl-rows li { display: grid; grid-template-columns: minmax(0, 1fr) 28% 22px; gap: 12px; align-items: center; min-height: 40px; border-top: 1px solid var(--rule); }
.wl-rows li:first-child { border-top: 0; }
.wl-x { display: grid; min-width: 0; overflow: hidden; }
.wl-code, .wl-word { grid-area: 1 / 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wl-code { font: 600 15px/1.3 var(--f-cond); letter-spacing: .4px; color: var(--ink-3); opacity: 0; }
.wl-word { font-weight: 600; font-size: 15px; line-height: 1.3; }
.wl-bar { display: block; height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 11%, transparent); width: var(--bw, 50%); justify-self: end; transform-origin: right center; }
.wl-ok { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--good-bg); color: var(--good); }
.wl-ok svg { width: 13px; height: 13px; }
.wl-stub .perf { margin: 0; }
/* the sample bars wear the same colours as the charts inside the app */
.wl-rows li:nth-child(1) .wl-bar { background: var(--h2); }
.wl-rows li:nth-child(2) .wl-bar { background: var(--s-tax); }
.wl-rows li:nth-child(3) .wl-bar, .wl-rows li:nth-child(4) .wl-bar { background: var(--s-gov); }
.wl-rows li:nth-child(5) .wl-bar { background: var(--s-ben); }
.wl-rows .wl-bar { height: 7px; opacity: .85; }
.wl-net { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; font: 700 21px/1 var(--f-cond); }
.wl-net .wl-bar { width: 46%; height: 14px; background: var(--s-net); }
.wl-copy { grid-area: copy; text-align: center; max-width: 560px; margin: 0 auto; }
.wl-copy h1 { font: 700 clamp(33px, 8.6vw, 64px)/1.02 var(--f-cond); letter-spacing: -.3px; text-wrap: balance; }
.wl-lead { color: var(--ink-2); font-size: 17px; line-height: 1.5; margin: 12px auto 0; max-width: 34em; text-wrap: pretty; }
.wl-actions { display: grid; gap: 10px; margin-top: 24px; }
.wl-drop { display: none; color: var(--ink-3); font-size: 14.5px; margin-top: 14px; }
.wl-priv { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ink-3); font-size: 14px; margin-top: 18px; }
.wl-priv svg { width: 16px; height: 16px; color: var(--good); flex: none; }
body.at-rest .foot { margin-top: 12px; }
@media (hover: hover) and (pointer: fine) { .wl-drop { display: block; } }
@media (min-width: 560px) { .wl-actions { display: flex; flex-wrap: wrap; justify-content: center; } }
@media (min-width: 900px) {
  .welcome { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); grid-template-areas: "copy art"; gap: 64px; align-items: center; padding-top: 12px; }
  .wl-copy { text-align: left; margin: 0; max-width: 540px; }
  .wl-lead { margin: 16px 0 0; font-size: 18px; }
  .wl-actions { margin-top: 28px; }
  .wl-actions { justify-content: flex-start; }
  .wl-drop { margin-top: 16px; }
  .wl-priv { justify-content: flex-start; }
  .wl-stub { max-width: 400px; padding: 20px 22px 22px; }
}
/* phones: the welcome screen has to fit one screen, so spacing is tighter */
@media (max-width: 759.98px) {
  .welcome { gap: 20px; padding: 0; }
  .wl-art { padding-top: 4px; }
  .wl-rows li { min-height: 38px; }
  .wl-lead { margin-top: 10px; }
  .wl-actions { margin-top: 20px; }
  .wl-actions .btn.xl { min-height: 52px; }
  .wl-priv { margin-top: 14px; }
  body.at-rest .foot { margin-top: 10px; font-size: 12.5px; line-height: 1.4; }
}
/* short screens: tighter still; fitWelcome() also drops sample lines until the screen fits */
@media (max-width: 899.98px) and (max-height: 760px) { .welcome { gap: 16px; } .wl-actions { margin-top: 16px; } .wl-priv { margin-top: 12px; } }
@media (max-width: 899.98px) and (max-height: 640px) { .wl-lead { font-size: 16px; } }

/* first launch: the slip rises, then each code turns into plain words */
.intro .wl-stub { animation: rise-lg .8s var(--ease-ios) both; }
.intro .wl-bar { animation: growX .7s var(--ease-ios) both; animation-delay: calc(260ms + var(--r, 5) * 70ms); }
.intro .wl-code { animation: codeOut .42s var(--ease-out) both; animation-delay: calc(1000ms + var(--r) * 170ms); }
.intro .wl-word { animation: wordIn .5s var(--ease-out) both; animation-delay: calc(1060ms + var(--r) * 170ms); }
.intro .wl-ok { animation: pop .5s var(--spring) both; animation-delay: calc(1160ms + var(--r) * 170ms); }
.intro .wl-copy > * { animation: rise .7s var(--ease-out) both; }
.intro .wl-copy > :nth-child(1) { animation-delay: 120ms; }
.intro .wl-copy > :nth-child(2) { animation-delay: 190ms; }
.intro .wl-copy > :nth-child(3) { animation-delay: 260ms; }
.intro .wl-copy > :nth-child(n+4) { animation-delay: 330ms; }
.intro.hold, .intro.hold * { animation-play-state: paused !important; }
@keyframes codeOut { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translate3d(0, -70%, 0); } }
@keyframes wordIn { 0% { opacity: 0; transform: translate3d(0, 70%, 0); } 100% { opacity: 1; transform: none; } }

/* ================= segmented control ================= */
.segc { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin-top: 16px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, var(--sheet)); }
.segc button { position: relative; z-index: 1; border: 0; background: none; min-height: 38px; border-radius: 9px; font-weight: 600; font-size: 15px; color: var(--ink-2); cursor: pointer; }
.segc button[aria-selected="true"] { color: var(--ink); }
.segc-t { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 9px; background: var(--thumb); box-shadow: 0 1px 2px rgba(10, 20, 32, .12), 0 4px 10px -4px rgba(10, 20, 32, .18); transform: translate3d(calc(var(--i, 0) * 100%), 0, 0); transition: transform .4s var(--ease-ios); }
#psheet .steps li { animation: rise .45s var(--ease-out) both; }
#psheet .steps li:nth-child(2) { animation-delay: 40ms; } #psheet .steps li:nth-child(3) { animation-delay: 80ms; } #psheet .steps li:nth-child(4) { animation-delay: 120ms; } #psheet .steps li:nth-child(n+5) { animation-delay: 160ms; }

/* ================= motion ================= */
/* only transform and opacity move, so the work stays on the compositor */
@keyframes rise { from { opacity: 0; transform: translate3d(0, 14px, 0); } }
@keyframes rise-s { from { opacity: 0; transform: translate3d(0, 8px, 0); } }
@keyframes rise-lg { from { opacity: 0; transform: translate3d(0, 28px, 0) scale(.97); } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes growX { from { transform: scaleX(0); } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes pop { from { opacity: 0; transform: scale(.3); } }
@keyframes ringDraw { from { stroke-dasharray: 0 200; } }

/* a payslip just opened: cards arrive one after another, charts fill in */
.view.anim > :not(.ov), .view.anim .ov > * { animation: rise .6s var(--ease-out) both; animation-delay: calc(var(--k, 0) * 55ms); }
.anim .segbar span, .anim .meter i, .anim .hb-t i { transform-origin: left center; animation: growX .85s var(--ease-ios) both; animation-delay: calc(var(--k, 0) * 55ms + 180ms); }
.anim .cb i { transform-origin: center bottom; animation: growY .75s var(--ease-ios) both; animation-delay: calc(var(--k, 0) * 55ms + 180ms); }
.anim .waffle i { animation: pop .5s var(--spring) both; animation-delay: calc(var(--k, 0) * 55ms + 140ms + var(--i, 0) * 24ms); }
.anim .ring .rf { animation: ringDraw 1s var(--ease-out) both; animation-delay: calc(var(--k, 0) * 55ms + 200ms); }
/* switching views: a shorter, quieter entrance */
.view.anim-soft > :not(.ov), .view.anim-soft .ov > * { animation: rise-s .42s var(--ease-out) both; animation-delay: calc(var(--k, 0) * 35ms); }
.anim-soft .segbar span, .anim-soft .meter i, .anim-soft .hb-t i { transform-origin: left center; animation: growX .6s var(--ease-ios) both; animation-delay: 80ms; }
.anim-soft .cb i { transform-origin: center bottom; animation: growY .55s var(--ease-ios) both; animation-delay: 80ms; }

/* low-memory phones, data saver, reduced transparency: no blur, no stagger */
html.lite .bar, html.lite .tabs, html.lite .dropov { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
html.lite body.scrolled .bar { background: var(--paper); }
@media (max-width: 759.98px) { html.lite .tabs { background: var(--sheet); } }
@media (min-width: 760px) and (max-width: 1023.98px) { html.lite .tabs { background: var(--paper); } }
html.lite .view > *, html.lite .ov > *, html.lite .intro .wl-copy > *, html.lite .intro .wl-stub { animation: fadeIn .28s linear both !important; animation-delay: 0s !important; }

/* ================= installed app and in-app viewers: fixed header, the content scrolls below it =================
   The page is exactly as tall as the measured visible area (--app-h, from window.innerHeight), so there is
   nothing to scroll but the content. The header is sticky with a plain background and no backdrop filter:
   since iOS 26, a Home Screen web app gets a blur over its top edge unless a fixed or sticky box with a plain
   background colour spans it (WebKit's LocalFrameView::fixedContainerEdges); iOS then uses that colour. */
@media screen {
  html.mode-shell, html.mode-shell body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  html.mode-shell body { height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); }
  html.mode-shell .app { height: 100%; min-height: 0; grid-template-rows: auto auto minmax(0, 1fr); }
  html.mode-shell .bar, html.mode-shell body.scrolled .bar { background: var(--paper); -webkit-backdrop-filter: none; backdrop-filter: none; }
  html.mode-shell body.scrolled .bar { border-bottom-color: var(--rule); }
  html.mode-shell .main { min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  html.mode-shell .card { scroll-margin-top: 12px; }
  html.mode-shell.kb-open .tabs { visibility: hidden; }
}
@media screen and (min-width: 760px) and (max-width: 1023.98px) {
  html.mode-shell .tabs { position: relative; top: auto; background: var(--paper); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media screen and (min-width: 1024px) {
  html.mode-shell .app { grid-template-rows: auto minmax(0, 1fr); }
  html.mode-shell .tabs { position: relative; top: auto; height: auto; min-height: 0; align-self: stretch; }
  html.mode-shell .card { scroll-margin-top: 16px; }
}

/* ================= alert popup (a file that isn't a payslip) ================= */
.alert-w { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: max(20px, var(--sa-top)) max(20px, env(safe-area-inset-right)) max(20px, var(--sa-bottom)) max(20px, env(safe-area-inset-left)); }
.al-bg { position: absolute; inset: 0; background: rgba(8, 15, 24, .42); opacity: 0; transition: opacity .3s var(--ease-out); }
.alert { position: relative; width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet); border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent); border-radius: 24px; padding: 26px 22px 24px; text-align: center; box-shadow: var(--shadow-lg); opacity: 0; transform: scale(.92); transition: transform .45s var(--spring), opacity .2s var(--ease-out); outline: none; }
.alert-w.on .al-bg { opacity: 1; }
.alert-w.on .alert { opacity: 1; transform: none; }
.al-x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; }
.al-x svg { width: 18px; height: 18px; }
.al-ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 12px; background: var(--warn-bg); color: var(--warn); }
.al-ic svg { width: 26px; height: 26px; }
.alert h2 { font: 700 24px/1.12 var(--f-cond); padding: 0 30px; text-wrap: balance; }
.alert p { color: var(--ink-2); font-size: 15.5px; line-height: 1.45; margin-top: 8px; text-wrap: pretty; }
.alert .al-f { font-size: 13.5px; color: var(--ink-3); overflow-wrap: anywhere; }
html.alert-open, html.alert-open body { overflow: hidden; }
@media print { .alert-w { display: none !important; } }

      if (jur && typ) tw[jur + typ[0].toUpperCase() + typ.slice(1)] = { cur: r.values.amount ?? null, ytd: r.values.ytd ?? null, desc: r.desc };
    }
    A.taxableWages = tw;

    /* ---- other blocks ---- */
    A.absences = (sec.absences ? sec.absences.rows : []).map((r) => ({ desc: r.desc, ...r.values }));
    A.vacation = parsed.vacation || [];
    A.withholding = parsed.withholding || [];
    A.payments = parsed.payments || [];
    const claim = (re) => { const w = A.withholding.find((x) => re.test(key(x.label))); return w || null; };
    const claimRow = claim(/montant total|total claim|claim amount/);
    A.claims = { fed: claimRow ? claimRow.federal : null, prov: claimRow ? claimRow.provincial : null };
    const extraRow = claim(/supplementaire|additional/);
    A.extraTax = { fed: extraRow ? extraRow.federal || 0 : 0, prov: extraRow ? extraRow.provincial || 0 : 0 };
    const nonZeroOther = A.withholding.filter((w) => w !== claimRow && w !== extraRow && ((w.federal || 0) !== 0 || (w.provincial || 0) !== 0));

    /* ---- money split (where the gross went) ---- */
    const incomeTax = sum(A.taxes.filter((t) => INCOME_TAX.includes(t.kind)).map((t) => t.amount));
    const govPlans = sum(A.taxes.filter((t) => !INCOME_TAX.includes(t.kind)).map((t) => t.amount));
    const pensionUnion = sum(A.deductions.filter((d) => ['pension', 'union', 'rrsp', 'ftq'].includes(d.kind)).map((d) => d.amount));
    const benefitsOther = sum(A.deductions.filter((d) => !['pension', 'union', 'rrsp', 'ftq'].includes(d.kind)).map((d) => d.amount));
    A.split = [
      { id: 'net', amount: S.net },
      { id: 'incomeTax', amount: incomeTax },
      { id: 'gov', amount: govPlans },
      { id: 'pensionUnion', amount: pensionUnion },
      { id: 'benefitsOther', amount: benefitsOther },
    ];
    const ytdIncomeTax = sum(A.taxes.filter((t) => INCOME_TAX.includes(t.kind)).map((t) => t.ytd));
    A.splitYtd = [
      { id: 'net', amount: S.netYtd },
      { id: 'incomeTax', amount: ytdIncomeTax },
      { id: 'gov', amount: r2(A.taxesTotal.ytd - ytdIncomeTax) },
      { id: 'pensionUnion', amount: sum(A.deductions.filter((d) => ['pension', 'union', 'rrsp', 'ftq'].includes(d.kind)).map((d) => d.ytd)) },
      { id: 'benefitsOther', amount: sum(A.deductions.filter((d) => !['pension', 'union', 'rrsp', 'ftq'].includes(d.kind)).map((d) => d.ytd)) },
    ];

    /* ---- ledger: every dollar from gross to net ---- */
    const order = ['fedTax', 'qcTax', 'provTax', 'qpp', 'qpp2', 'cpp', 'cpp2', 'ei', 'qpip', 'otherTax'];
    PD.TAX_ORDER = order;
    const dOrder = ['pension', 'rrsp', 'union', 'life', 'medDent', 'humanity', 'ftq', 'transfer', 'other'];
    const ledgerItems = [
      ...A.taxes.slice().sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind)).map((t) => ({ type: 'tax', kind: t.kind, desc: t.desc, amount: t.amount })),
      ...A.deductions.slice().sort((a, b) => dOrder.indexOf(a.kind) - dOrder.indexOf(b.kind)).map((d) => ({ type: 'ded', kind: d.kind, desc: d.desc, amount: d.amount })),
    ].filter((x) => x.amount);
    let run = S.gross || 0;
    A.ledger = ledgerItems.map((x) => { run = r2(run - x.amount); return { ...x, after: run }; });

    /* ---- the codes in parentheses: one line per set of Workday worktag values ---- */
    const codeKey = (e) => (e.codes ? e.codes.join(', ') : null);
    const codeMap = {};
    for (const e of A.earnings) {
      const k = codeKey(e);
      if (!k) continue;
      const c = (codeMap[k] = codeMap[k] || { code: k, parts: e.codes, cats: new Set(), curHours: 0, curAmount: 0, ytdHours: 0, ytdAmount: 0, regHours: 0, regAmount: 0, rates: new Set(), hits: [] });
      c.cats.add(e.cat);
      c.curHours = r2(c.curHours + (e.hours || 0));
      c.curAmount = r2(c.curAmount + (e.amount || 0));
      c.ytdHours = r2(c.ytdHours + (e.ytdHours || 0));
      c.ytdAmount = r2(c.ytdAmount + (e.ytd || 0));
      if (e.cat === 'regular') { c.regHours = r2(c.regHours + (e.ytdHours || 0)); c.regAmount = r2(c.regAmount + (e.ytd || 0)); }
      if (e.current && e.rate && e.cat === 'regular') c.rates.add(e.rate);
    }
    A.codes = Object.values(codeMap).map((c) => ({
      ...c, cats: [...c.cats], rates: [...c.rates], current: c.curHours > 0 || c.curAmount !== 0,
      avgRegRate: c.regHours ? r2(c.regAmount / c.regHours) : null,
    })).sort((a, b) => (b.current - a.current) || (b.ytdHours - a.ytdHours));
    const groupsBySecond = {};
    A.codes.forEach((c) => { const g = c.parts[c.parts.length - 1]; groupsBySecond[g] = groupsBySecond[g] || { code: g, ytdHours: 0, current: false, members: [] }; groupsBySecond[g].ytdHours = r2(groupsBySecond[g].ytdHours + c.ytdHours); groupsBySecond[g].current = groupsBySecond[g].current || c.current; groupsBySecond[g].members.push(c.code); });
    A.codeGroups = Object.values(groupsBySecond).sort((a, b) => (b.current - a.current) || (b.ytdHours - a.ytdHours));
    // Paid holidays come in date order, so their split across codes dates a change of code.
    A.codeTimeline = null;
    if (ag && year && H.periodEnd) {
      const holi = {};
      A.earnings.filter((e) => e.cat === 'holiday' && e.codes && e.ytdHours > 0).forEach((e) => { const k = codeKey(e); holi[k] = (holi[k] || 0) + e.ytdHours; });
      const keys = Object.keys(holi);
      const dates = PD.holidayDates(year, ag.holidayIds).filter((d, i, arr) => d <= H.periodEnd && arr.indexOf(d) === i);
      const totalDays = keys.reduce((s2, k) => s2 + holi[k], 0) / 8;
      if (keys.length === 2 && Number.isInteger(totalDays) && totalDays === dates.length) {
        const curKeys = new Set(A.codes.filter((c) => c.current).map((c) => c.code));
        const later = keys.find((k) => curKeys.has(k));
        const earlier = keys.find((k) => k !== later);
        if (later && earlier && Number.isInteger(holi[earlier] / 8)) {
          const n = holi[earlier] / 8;
          A.codeTimeline = { from: earlier, to: later, nFrom: n, nTo: dates.length - n, lastFrom: dates[n - 1], firstTo: dates[n] };
        }
      }
    }

    /* ---- year-end tax slips so far (T4 / RL-1 boxes), from year-to-date amounts ---- */
    const ysum = (arr) => sum(arr.map((x) => x.ytd));
    const tY = (k) => ysum(A.taxes.filter((t) => t.kind === k));
    const dY = (k) => ysum(A.deductions.filter((d) => d.kind === k));
    const eY = (k) => ysum(A.employer.filter((e) => e.kind === k));
    const capped = (v, cap) => (v == null ? null : cap ? Math.min(v, cap) : v);
    const fedSubjY = tw.fedSubject ? tw.fedSubject.ytd : S.grossYtd;
    const provSubjY = tw.provSubject ? tw.provSubject.ytd : S.grossYtd;
    A.slips = {
      t4: [
        ['14', 'empIncome', fedSubjY], ['17', 'qpp', tY('qpp')], ['17A', 'qpp2', tY('qpp2')], ['18', 'ei', tY('ei')],
        ['20', 'rpp', dY('pension')], ['22', 'fedTax', tY('fedTax')], ['24', 'eiInsurable', capped(S.grossYtd, gov && gov.ei && gov.ei.mie)],
        ['26', 'qppPensionable', capped(provSubjY, gov && gov.qpp && gov.qpp.mga)], ['44', 'union', dY('union')], ['46', 'donations', dY('humanity')],
        ['52', 'pa', Math.round(dY('pension') + eY('erPension'))], ['55', 'qpip', tY('qpip')], ['56', 'qpipInsurable', capped(S.grossYtd, gov && gov.qpip && gov.qpip.mie)],
        ['85', 'healthPremiums', dY('medDent')],
      ].filter(([, , v]) => v),
      rl1: [
        ['A', 'empIncome', provSubjY], ['B', 'qpp', tY('qpp')], ['B.A', 'qpp2', tY('qpp2')], ['C', 'ei', tY('ei')], ['D', 'rpp', dY('pension')],
        ['E', 'qcTax', tY('qcTax')], ['F', 'union', dY('union')], ['G', 'qppPensionable', capped(provSubjY, gov && gov.qpp && gov.qpp.mga)],
        ['H', 'qpip', tY('qpip')], ['I', 'qpipInsurable', capped(S.grossYtd, gov && gov.qpip && gov.qpip.mie)], ['J', 'employerHealth', eY('provTB')],
        ['N', 'donations', dY('humanity')], ['235', 'healthPremiums', dY('medDent')],
      ].filter(([, , v]) => v),
    };

    /* ============ CHECKS ============ */
    const near = (a, b, tol = 0.011) => a != null && b != null && Math.abs(a - b) <= tol;
    const fmt = (L, v) => L.money(v);

    // --- math ---
    if (S.gross != null) {
      chk({ group: 'math', id: 'earnSum', status: near(A.earningsTotal.current, S.gross) ? 'ok' : 'warn',
        title: T('Earnings lines add up to gross pay', 'Les lignes de gains totalisent la paie brute'),
        detail: (L) => L.lang === 'fr' ? `Somme des lignes : ${fmt(L, A.earningsTotal.current)}; paie brute : ${fmt(L, S.gross)}` : `Sum of lines: ${fmt(L, A.earningsTotal.current)}; gross pay: ${fmt(L, S.gross)}` });
    }
    if (S.taxes != null) chk({ group: 'math', id: 'taxSum', status: near(A.taxesTotal.current, S.taxes) ? 'ok' : 'warn',
      title: T('Tax lines add up to the taxes total', 'Les lignes d’impôt totalisent le montant des impôts'),
      detail: (L) => `${fmt(L, A.taxesTotal.current)} = ${fmt(L, S.taxes)}` });
    A.dedGroups.forEach((g, i) => {
      const col = S.groups.find((c) => key(c.label) === key(g.title)) || S.groups[i];
      if (!col) return;
      chk({ group: 'math', id: 'dedSum' + i, status: near(g.sum, col.current) ? 'ok' : 'warn',
        title: (L) => (L.lang === 'fr' ? `« ${g.title} » totalise ${fmt(L, col.current)}` : `“${g.title}” lines add up to ${fmt(L, col.current)}`),
        detail: (L) => g.rows.filter((x) => x.amount).map((x) => fmt(L, x.amount)).join(' + ') + ` = ${fmt(L, g.sum)}` });
    });
    if (S.gross != null && S.net != null) {
      const calcNet = r2(S.gross - (S.taxes || 0) - sum(S.groups.map((g) => g.current)));
      chk({ group: 'math', id: 'netCalc', status: near(calcNet, S.net) ? 'ok' : 'warn',
        title: T('Gross minus everything withheld equals net pay', 'Le brut moins tout ce qui est retenu donne la paie nette'),
        detail: (L) => `${fmt(L, S.gross)} − ${fmt(L, S.taxes)} − ${S.groups.map((g) => fmt(L, g.current)).join(' − ')} = ${fmt(L, calcNet)}` });
      const calcNetY = r2((S.grossYtd || 0) - (S.taxesYtd || 0) - sum(S.groups.map((g) => g.ytd)));
      // every section's year-to-date lines must also add up to that section's year-to-date total
      const ytdOff = [];
      if (S.grossYtd != null && !near(A.earningsTotal.ytd, S.grossYtd, 0.02)) ytdOff.push([sec.earnings && sec.earnings.title, A.earningsTotal.ytd, S.grossYtd]);
      if (S.taxesYtd != null && !near(A.taxesTotal.ytd, S.taxesYtd, 0.02)) ytdOff.push([sec.taxes && sec.taxes.title, A.taxesTotal.ytd, S.taxesYtd]);
      A.dedGroups.forEach((g, i) => {
        const col = S.groups.find((c) => key(c.label) === key(g.title)) || S.groups[i];
        if (col && col.ytd != null && !near(g.sumYtd, col.ytd, 0.02)) ytdOff.push([g.title, g.sumYtd, col.ytd]);
      });
      chk({ group: 'math', id: 'netYtd', status: near(calcNetY, S.netYtd, 0.02) && !ytdOff.length ? 'ok' : 'warn',
        title: T('Year-to-date totals are consistent', 'Les cumuls annuels sont cohérents'),
        detail: (L) => (L.lang === 'fr' ? `Brut cumulé ${fmt(L, S.grossYtd)} − retenues = net cumulé ${fmt(L, calcNetY)}` : `YTD gross ${fmt(L, S.grossYtd)} − withholdings = YTD net ${fmt(L, calcNetY)}`)
          + (near(calcNetY, S.netYtd, 0.02) ? '' : L.lang === 'fr' ? `; le talon indique ${fmt(L, S.netYtd)}` : `; the payslip shows ${fmt(L, S.netYtd)}`)
          + ytdOff.map(([t, a, b]) => (L.lang === 'fr' ? `. Les cumuls des lignes « ${t || '?'} » font ${fmt(L, a)}, mais le total cumulé est de ${fmt(L, b)}` : `. The year-to-date lines of “${t || '?'}” add up to ${fmt(L, a)}, but the year-to-date total is ${fmt(L, b)}`)).join('') });
    }
    if (A.payments.length && S.net != null) {
      const dep = sum(A.payments.map((p) => p.amount));
      chk({ group: 'math', id: 'deposit', status: near(dep, S.net) ? 'ok' : 'warn',
        title: T('Net pay matches the bank deposit', 'La paie nette correspond au dépôt bancaire'),
        detail: (L) => `${A.payments.map((p) => `${p.bank} ${fmt(L, p.amount)}`).join(', ')}` });
    }
    const priced = curE.filter((e) => e.hours && e.rate && e.cat !== 'unpaid');
    const lineBad = priced.filter((e) => e.amount != null && !near(r2(e.hours * e.rate), e.amount, 0.011));
    const lineCount = priced.length;
    if (lineCount) chk({ group: 'math', id: 'lineMath', status: lineBad.length ? 'warn' : 'ok',
      title: (L) => (L.lang === 'fr' ? `Heures × taux = montant (${lineCount} ligne${lineCount > 1 ? 's' : ''})` : `Hours × rate = amount (${lineCount} line${lineCount > 1 ? 's' : ''})`),
      detail: (L) => lineBad.length ? lineBad.map((e) => `${e.desc}: ${L.num(e.hours)} × ${L.money(e.rate)} ≠ ${L.money(e.amount)}`).join('; ')
        : (L.lang === 'fr' ? 'Chaque ligne de cette paie se recalcule exactement.' : 'Every line on this pay recalculates exactly.') });

    // --- government plans ---
    A.govChecks = {};
    const pens = tw.provSubject ? tw.provSubject.cur : S.gross;
    if (gov && S.gross != null && A.province === 'QC') {
      const prevYtd = (t) => (t ? r2((t.ytd || 0) - (t.amount || 0)) : 0);
      // QPP
      const q = tx('qpp');
      if (q && gov.qpp) {
        const qppFor = (n) => r2(Math.min(Math.max(0, pens - gov.qpp.exempt / n) * gov.qpp.rate, Math.max(0, gov.qpp.max - prevYtd(q))));
        const n = Ps.reduce((b, c) => (Math.abs(qppFor(c) - q.amount) < Math.abs(qppFor(b) - q.amount) ? c : b), P);
        const exp = qppFor(n);
        A.meta.Pyear = n;
        A.govChecks.qpp = { expected: exp, max: gov.qpp.max, pays: n };
        const ex = (L) => (n !== P ? (L.lang === 'fr' ? ` (${L.money(gov.qpp.exempt)} ÷ ${n} paies en ${year})` : ` (${L.money(gov.qpp.exempt)} ÷ ${n} pays in ${year})`) : '');
        chk({ group: 'gov', id: 'qpp', status: near(exp, q.amount, 0.02) ? 'ok' : 'warn',
          title: T(`QPP contribution matches the ${year} formula`, `La cotisation au RRQ correspond à la formule ${year}`),
          detail: (L) => L.lang === 'fr'
            ? `(${fmt(L, pens)} − exemption ${fmt(L, gov.qpp.exempt / n)}${ex(L)}) × ${L.pct(gov.qpp.rate * 100, 2)} = ${fmt(L, exp)}; Workday : ${fmt(L, q.amount)}`
            : `(${fmt(L, pens)} − ${fmt(L, gov.qpp.exempt / n)} exemption${ex(L)}) × ${L.pct(gov.qpp.rate * 100, 2)} = ${fmt(L, exp)}; Workday: ${fmt(L, q.amount)}` });
      }
      // EI
      const e = tx('ei');
      if (e && gov.ei) {
        const exp = r2(Math.min(S.gross * gov.ei.rate, Math.max(0, gov.ei.max - prevYtd(e))));
        const expYtd = r2(Math.min((S.grossYtd || 0) * gov.ei.rate, gov.ei.max));
        // Workday rounds on the year-to-date total, so a few cents' catch-up is fine when the year's total is right
        const d = Math.abs(exp - e.amount);
        const ytdFits = near(r2(expYtd - prevYtd(e)), e.amount, 0.011);
        A.govChecks.ei = { expected: exp, max: gov.ei.max };
        chk({ group: 'gov', id: 'ei', status: d <= 0.02 ? 'ok' : ytdFits && d <= 0.05 ? 'okish' : 'warn',
          title: T(`EI premium matches the ${year} Québec rate (${(gov.ei.rate * 100).toFixed(2)}%)`, `La cotisation d’AE correspond au taux québécois ${year} (${(gov.ei.rate * 100).toFixed(2).replace('.', ',')} %)`),
          detail: (L) => L.lang === 'fr'
            ? `${L.pct(gov.ei.rate * 100, 2)} × ${fmt(L, S.gross)} = ${fmt(L, exp)}; Workday : ${fmt(L, e.amount)}. Workday calcule sur le cumul annuel (${L.pct(gov.ei.rate * 100, 2)} × ${fmt(L, S.grossYtd)} = ${fmt(L, expYtd)}), d’où un écart possible de quelques cents.`
            : `${L.pct(gov.ei.rate * 100, 2)} × ${fmt(L, S.gross)} = ${fmt(L, exp)}; Workday: ${fmt(L, e.amount)}. Workday rounds on the year-to-date total (${L.pct(gov.ei.rate * 100, 2)} × ${fmt(L, S.grossYtd)} = ${fmt(L, expYtd)}), so a difference of a few cents is normal.` });
      }
      // QPIP
      const qp = tx('qpip');
      if (qp && gov.qpip) {
        const exp = r2(Math.min(S.gross * gov.qpip.rate, Math.max(0, gov.qpip.max - prevYtd(qp))));
        A.govChecks.qpip = { expected: exp, max: gov.qpip.max };
        chk({ group: 'gov', id: 'qpip', status: near(exp, qp.amount, 0.02) ? 'ok' : 'warn',
          title: T(`QPIP premium matches the ${year} rate (${(gov.qpip.rate * 100).toFixed(3)}%)`, `La cotisation au RQAP correspond au taux ${year} (${(gov.qpip.rate * 100).toFixed(3).replace('.', ',')} %)`),
          detail: (L) => `${L.pct(gov.qpip.rate * 100, 3)} × ${fmt(L, S.gross)} = ${fmt(L, exp)}; Workday${L.lang === 'fr' ? ' :' : ':'} ${fmt(L, qp.amount)}` });
      }
      // QPP2: 4% on pensionable pay between the first and second ceilings, once the year-to-date total passes the first.
      const q2 = tx('qpp2');
      if (q2 && gov.qpp && gov.qpp.rate2) {
        const ytdP = tw.provSubject ? tw.provSubject.ytd : S.grossYtd;
        const prevP = r2((ytdP || 0) - pens);
        const band = Math.max(0, Math.min(ytdP || 0, gov.qpp.mga2) - Math.max(prevP, gov.qpp.mga));
        const exp = r2(Math.min(band * gov.qpp.rate2, Math.max(0, gov.qpp.max2 - prevYtd(q2))));
        A.govChecks.qpp2 = { expected: exp, max: gov.qpp.max2 };
        chk({ group: 'gov', id: 'qpp2', status: near(exp, q2.amount, 0.05) ? 'ok' : 'info',
          title: T(`Second QPP contribution (QPP2) matches the ${year} formula`, `La deuxième cotisation au RRQ (RRQ2) correspond à la formule ${year}`),
          detail: (L) => L.lang === 'fr'
            ? `4 % de la paie admissible entre ${fmt(L, gov.qpp.mga)} et ${fmt(L, gov.qpp.mga2)} dans l’année : ${fmt(L, exp)}; Workday : ${fmt(L, q2.amount)}`
            : `4% of pensionable pay between ${fmt(L, gov.qpp.mga)} and ${fmt(L, gov.qpp.mga2)} in the year: ${fmt(L, exp)}; Workday: ${fmt(L, q2.amount)}` });
      }

      // Taxable wages reconciliation
      const qppAmt = q ? q.amount : 0;
      const q2Amt = q2 ? q2.amount || 0 : 0;
      // the deductible part of QPP needs that year's rates; without them the taxable wages aren't explained
      const enhDed = gov.qpp ? r2(qppAmt * (gov.qpp.enh / gov.qpp.rate)) : null;
      const pensionEE = dedSum('pension') + dedSum('rrsp');
      const union = dedSum('union');
      const provTB = sum(emp('provTB').concat(emp('bothTB')).map((x) => x.amount));
      const fedTB = sum(emp('fedTB').concat(emp('bothTB')).map((x) => x.amount));
      A.recon = enhDed == null ? null : {
        fed: { steps: [['gross', S.gross], ['tb', fedTB], ['pension', -pensionEE], ['union', -union], ['qppEnh', -enhDed], ['qpp2', -q2Amt]].filter(([, v]) => v), result: r2(S.gross + fedTB - pensionEE - union - enhDed - q2Amt), workday: tw.fedTaxable ? tw.fedTaxable.cur : null, subject: tw.fedSubject ? tw.fedSubject.cur : null },
        prov: { steps: [['gross', S.gross], ['tb', provTB], ['pension', -pensionEE], ['qppEnh', -enhDed], ['qpp2', -q2Amt]].filter(([, v]) => v), result: r2(S.gross + provTB - pensionEE - enhDed - q2Amt), workday: tw.provTaxable ? tw.provTaxable.cur : null, subject: tw.provSubject ? tw.provSubject.cur : null },
        enhDed,
      };
      for (const j of A.recon ? ['fed', 'prov'] : []) {
        const R = A.recon[j];
        if (R.workday == null) continue;
        chk({ group: 'gov', id: 'taxable-' + j, status: near(R.result, R.workday, 0.02) ? 'ok' : 'warn',
          title: j === 'fed' ? T('Federal taxable wages are explained line by line', 'Le salaire imposable fédéral s’explique ligne par ligne') : T('Québec taxable wages are explained line by line', 'Le salaire imposable du Québec s’explique ligne par ligne'),
          detail: (L) => (L.lang === 'fr' ? `Recalculé : ${fmt(L, R.result)}; Workday : ${fmt(L, R.workday)}` : `Recalculated: ${fmt(L, R.result)}; Workday: ${fmt(L, R.workday)}`) });
      }

      // Income tax estimates (T4127 / TP-1015.F style annualization)
      const fedT = tx('fedTax');
      const F = edition(gov.fed, H.payDate);
      // the number of pays QPP was worked out with, or whichever of the year's possible counts fits best
      const maxed = (t, max) => !!t && (t.ytd || 0) >= max - 0.01;
      const best = (f, amt) => (A.meta.Pyear ? A.meta.Pyear : Ps.reduce((b, c) => (Math.abs(f(c) - amt) < Math.abs(f(b) - amt) ? c : b), P));
      if (F && fedT && tw.fedTaxable && A.claims.fed != null && gov.qpp && gov.ei && gov.qpip) { // the credits need all three plans
        const fedFor = (n) => {
          const Aann = n * tw.fedTaxable.cur;

      <ul class="gstat">${groups.map(([g, rows]) => { const ok = rows.filter((c) => c.status === 'ok' || c.status === 'okish').length, cnt = rows.filter((c) => c.status !== 'info').length, w = rows.some((c) => c.status === 'warn'); return `<li class="${w ? 'warn' : ''}"><b>${cnt ? `${ok}/${cnt}` : '—'}</b><span>${esc(s.grp[g])}</span></li>`; }).join('')}</ul></div></section>`;
    const lists = groups.map(([g, rows]) => card('k-' + g, s.grp[g], `<ul class="checks">${rows.map((c) => `<li class="${c.status}"><span class="ic" aria-hidden="true">${stIcon(c.status)}</span><div><div class="ttl"><b>${esc(val(c.title, L))}</b><span class="st">${esc(s.st[c.status])}</span></div><p>${esc(val(c.detail, L))}</p></div></li>`).join('')}</ul>`)).join('');
    return head + lists;
  }

  /* ---------- year ---------- */
  function vYear(A, L) {
    const s = L.s, S = A.summary, g = S.grossYtd || 1;
    const tiles = `<div class="tiles"><div><span>${esc(s.ytdGross)}</span><b>${esc(L.money(S.grossYtd))}</b></div><div><span>${esc(s.ytdNet)}</span><b>${esc(L.money(S.netYtd))}</b><small>${esc(L.pct((S.netYtd / g) * 100, 0))} ${esc(s.pctOfGross)}</small></div><div><span>${esc(s.ytdWithheld)}</span><b>${esc(L.money(S.grossYtd - S.netYtd))}</b><small>${esc(L.pct(((S.grossYtd - S.netYtd) / g) * 100, 0))} ${esc(s.pctOfGross)}</small></div></div>`;
    const parts = A.splitYtd.filter((x) => x.amount > 0);
    const split = card('y-split', s.h.ytdSplit, `<div class="segbar" role="img" aria-label="${esc(parts.map((x) => `${s.split[x.id]} ${L.money(x.amount)}`).join(', '))}">${parts.map((x) => `<span class="c-${x.id}" style="flex:${x.amount}" data-tip="${esc(`<b>${esc(s.split[x.id])}</b><br>${esc(L.money(x.amount))} (${esc(L.pct((x.amount / g) * 100))})`)}"></span>`).join('')}</div>${splitLegend(parts, g, L)}`, { intro: esc(s.ytdIntro(L.date(A.meta.payDate))) });
    const mx = A.taxes.filter((t) => t.annualMax).sort(taxSort);
    const P = A.projections || {};
    const maxes = mx.length ? card('y-max', s.h.maxes, `<div class="maxes">${mx.map((t) => {
      const p = P[t.kind];
      const txt = t.maxReached ? s.projHit : p && p.thisYear ? s.projSoon(L.dateS(p.date), L.money(p.perPay)) : p ? s.projLater : '';
      return `<div class="mxr"><div class="mxr-h"><b>${esc(L.kind(t.kind))}</b><span>${esc(s.paidOfMax(L.money(t.ytd), L.money(t.annualMax)))}</span></div>${meter(t.maxPct * 100, t.maxReached ? 'm-good' : 'm-gov')}${txt ? `<p>${esc(txt)}</p>` : ''}</div>`;
    }).join('')}</div>`, { intro: esc(s.maxIntro) }) : '';
    const order = ['regular', 'overtime', 'premiums', 'holiday', 'vacation', 'sick', 'other'];
    const cats = order.filter((c) => A.ytdByCat[c] && A.ytdByCat[c].amount);
    const top = Math.max(...cats.map((c) => A.ytdByCat[c].amount), 1);
    const byType = cats.length ? card('y-type', s.h.byType, `<div class="hbars">${cats.map((c) => { const x = A.ytdByCat[c]; return `<div class="hb"><span class="hb-l">${esc(s.cat[c])}${x.hours ? `<small>${esc(L.h(x.hours))}</small>` : ''}</span><span class="hb-t"><i style="width:${((x.amount / top) * 100).toFixed(1)}%"></i></span><span class="hb-v">${esc(L.money(x.amount))}<small>${esc(pct0(L, (x.amount / g) * 100))}</small></span></div>`; }).join('')}</div>`) : '';
    const slipBox = (title, sub, rows) => `<div class="slip"><div class="slip-h"><b>${esc(title)}</b><span>${esc(sub)}</span></div><div class="boxes">${rows.map(([b, k, v]) => `<div class="bx"><span class="bn">${esc(b)}</span><span class="bl">${esc(s.slipName[k] || k)}</span><span class="bv">${esc(L.money(v))}</span></div>`).join('')}</div></div>`;
    const slips = A.slips && (A.slips.t4.length || A.slips.rl1.length) ? card('y-slips', s.h.slips, `<div class="two in">${slipBox('T4', s.t4Sub, A.slips.t4)}${slipBox(s.rl1, s.rl1Sub, A.slips.rl1)}</div><ul class="tips">${s.slipTips.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`, { intro: esc(s.slipsIntro(L.date(A.meta.payDate))) }) : '';
    let toff = '';
    if (A.vacation.length || A.absences.length) {
      const vac = A.vacation.length ? `<h3 class="sub">${esc(s.vacationTitle)}</h3><div class="tiles sm">${A.vacation.map((v) => `<div><span>${esc(PD.plainLabel(v.label, L.lang))}</span><b>${esc(L.num(v.value))}</b>${L.lang === 'fr' ? '' : `<small>${esc(v.label)}</small>`}</div>`).join('')}</div><p class="note">${esc(A.agreement ? PD.agText(A.agreement, L.lang, 'vacNote') : s.vacNoteGeneric)}</p>` : '';
      const abs = A.absences.length ? `<h3 class="sub">${esc(s.plans)}</h3><div class="plans"><div class="pl-h"><span></span><span>${esc(s.accrued)}</span><span>${esc(s.used)}</span><span>${esc(s.available)}</span></div>${A.absences.map((a) => `<div class="pl ${a.available < 0 ? 'neg' : ''}"><span><b>${esc(PD.plainLabel(a.desc, L.lang))}</b><small>${esc(a.desc)}</small></span><span class="num">${esc(L.num(a.accrued))}</span><span class="num">${esc(L.num(a.reduced))}</span><span class="num"><b>${esc(L.num(a.available))}</b></span></div>`).join('')}</div>${A.absences.filter((a) => a.available < 0).map((a) => `<p class="note">${esc(s.negBank(L.num(a.available)))}</p>`).join('')}` : '';
      toff = card('y-off', s.h.timeoff, vac + abs);
    }
    let hist = '';
    if (state.slips.length > 1) {
      const max = Math.max(...state.slips.map((x) => x.A.summary.gross || 0)) || 1;
      hist = card('y-hist', s.h.history, `<div class="cols" role="img" aria-label="${esc(state.slips.map((x) => `${L.dateS(x.A.meta.payDate)}: ${L.money(x.A.summary.net)}`).join(', '))}">${state.slips.map((x, i) => `<div class="col ${i === state.cur ? 'on' : ''}" data-tip="${esc(`<b>${esc(L.date(x.A.meta.payDate))}</b><br>${esc(s.net)} ${esc(L.money(x.A.summary.net))}<br>${esc(s.gross)} ${esc(L.money(x.A.summary.gross))}`)}"><span class="cv">${esc(L.money0(x.A.summary.net))}</span><span class="cb"><i class="g" style="height:${((x.A.summary.gross || 0) / max) * 100}%"></i><i class="n" style="height:${((x.A.summary.net || 0) / max) * 100}%"></i></span><span class="cdt">${esc(L.dateS(x.A.meta.payDate))}</span></div>`).join('')}</div>
        <ul class="hleg"><li><span class="sw c-net"></span>${esc(s.net)}</li><li><span class="sw gr"></span>${esc(s.gross)}</li></ul>`, { intro: esc(s.historyIntro) });
    }
    const all = `<details class="more card-like"><summary>${I.chev}${esc(s.allLines)} (${A.earnings.length})</summary><div class="lis">${A.earnings.map((e) => li({ name: earningName(e, L), orig: e.desc, amt: L.money(e.ytd), sub: e.ytdHours ? L.h(e.ytdHours) : '', cls: 'sm' })).join('')}</div></details>`;
    const N = s.yearNav;
    const secs = [['y-off', N.off, toff], ['y-hist', N.hist, hist], ['y-max', N.max, maxes], ['y-split', N.split, split], ['y-type', N.type, byType], ['y-slips', N.slips, slips]].filter((x) => x[2]);
    return jumpBar(s.tabs.year, secs.map(([id, t]) => [id, t])) + tiles + secs.map((x) => x[2]).join('') + all;
  }

  /* ---------- ask: the assistant runs on this device; questions and answers stay in memory ---------- */
  const askCtx = () => ({ recs: state.slips.length ? state.slips : [state.sample], cur: state.slips.length ? state.cur : 0, makeL, lang: state.lang });
  function answerHtml(a) {
    const out = [];
    let ul = null;
    a.paras.forEach((p) => {
      if (p && p.li) { if (!ul) { ul = []; out.push(ul); } ul.push(p.li); } else { ul = null; out.push(p); }
    });
    return out.map((x) => (Array.isArray(x) ? `<ul>${x.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : `<p>${esc(x)}</p>`)).join('');
  }
  function qaHtml(x, L) {
    const a = x.a, k = makeL(a.lang).s.ask;
    const when = state.slips.length > 1 && x.date ? `<small class="q-d">${esc(L.dateS(x.date))}</small>` : '';
    return `<article class="qa" lang="${a.lang}">
      <p class="q"><span class="sr">${esc(L.s.ask.you)} : </span><span class="q-t">${esc(x.q)}</span>${when}</p>
      <div class="a">${answerHtml(a)}
        ${a.open ? `<button class="btn primary a-open" data-act="open" data-then="${esc(x.q)}">${I.upload}<span>${esc(k.openSecond)}</span></button>` : ''}
        ${a.links.length ? `<div class="a-go">${a.links.map(([t, g]) => `<button class="link" data-go="${esc(g)}">${esc(t)}${I.chev}</button>`).join('')}</div>` : ''}
        ${a.chips.length ? `<div class="qchips">${a.chips.map((c) => `<button class="qchip" data-ask="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
      </div></article>`;
  }
  function askLog(L) {
    if (!state.chat.length) return '';
    return `<div class="ask-lh"><h2 class="sr">${esc(L.s.ask.title)}</h2><button class="link" data-act="ask-clear">${esc(L.s.ask.clear)}</button></div>${state.chat.map((x) => qaHtml(x, L)).join('')}`;
  }
  function starters(L) {
    const k = L.s.ask;
    return (state.slips.length > 1 ? [k.starterCompare, ...k.starters.slice(0, 5)] : k.starters);
  }
  function vAsk(A, L) {
    const s = L.s, k = s.ask;
    return `<section class="ask" aria-labelledby="ask-h">
      <div class="ask-hd"><h2 id="ask-h">${esc(k.title)}</h2><p>${esc(k.sub)}</p></div>
      <form class="ask-f" id="ask-f" role="search" autocomplete="off">
        <label class="sr" for="ask-q">${esc(k.placeholder)}</label>
        <input id="ask-q" name="q" type="text" inputmode="text" enterkeyhint="send" autocapitalize="sentences" autocorrect="on" spellcheck="true" maxlength="240" placeholder="${esc(k.placeholder)}">
        <button class="ask-go" type="submit" aria-label="${esc(k.send)}">${I.send}</button>
      </form>
      <div class="qchips ask-st ${state.chat.length ? 'hide' : ''}">${starters(L).map((c) => `<button class="qchip" data-ask="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <p class="ask-pv">${I.lock}<span>${esc(s.privacy)}</span></p>
    </section>
    <div class="ask-log" id="ask-log" aria-live="polite">${askLog(L)}</div>`;
  }
  /* ask a question: the newest answer goes on top, right under the box */
  function ask(q) {
    q = String(q || '').trim().slice(0, 240);
    const r = rec();
    if (!q || !r || !PD.Ask) return;
    let a;
    try { a = PD.Ask.answer(q, askCtx()); } catch (e) { console.error(e); a = { lang: state.lang, paras: [makeL(state.lang).s.ask.unsure], links: [], chips: makeL(state.lang).s.ask.starters.slice(0, 4) }; }
    state.chat.unshift({ q, a, date: r.A.meta.payDate });
    if (state.chat.length > 30) state.chat.length = 30;
    if (state.view !== 'ask') { go('ask'); return; }
    const L = makeL(state.lang, r.A.agreement, r.A.meta.year), log = $('#ask-log');
    if (!log) return;
    log.innerHTML = askLog(L);
    const st = $('.ask-st'); if (st) st.classList.add('hide');
    const first = $('.qa', log);
    if (first && !REDUCED) { first.classList.add('qa-in'); setTimeout(() => first.classList.remove('qa-in'), 700); }
    const f = $('#ask-f');
    if (f) { const top = f.getBoundingClientRect().top; if (top < 0 || top > window.innerHeight * 0.4) f.scrollIntoView({ block: 'start', behavior: REDUCED ? 'auto' : 'smooth' }); }
  }
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'ask-f') return;
    e.preventDefault();
    const q = $('#ask-q');
    const v = q.value;
    q.value = '';
    // on phones, put the keyboard away so the answer is visible
    if (matchMedia('(pointer: coarse)').matches) q.blur();
    ask(v);
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest && e.target.closest('[data-ask],[data-act="ask-clear"]');
    if (!t) return;
    if (t.dataset.ask) { ask(t.dataset.ask); return; }
    state.chat = [];
    const log = $('#ask-log');
    if (log) log.innerHTML = '';
    const st = $('.ask-st'); if (st) st.classList.remove('hide');
    const q = $('#ask-q'); if (q && !matchMedia('(pointer: coarse)').matches) q.focus();
  });

  /* ---------- guide ---------- */
  function codesCard(A, L) {
    const s = L.s;
    if (!A.codes || !A.codes.length) return '';
    const firsts = [...new Set(A.codes.filter((c) => c.current).map((c) => c.parts[0]))].join(', ') || '—';
    const T = A.codeTimeline;
    let tl = '';
    if (T) {
      const y = A.meta.year, t0 = Date.UTC(y, 0, 1), t1 = Date.UTC(y + 1, 0, 1);
      const pos = (iso) => (((Date.parse(iso + 'T00:00:00Z') - t0) / (t1 - t0)) * 100).toFixed(2);
      const dates = PD.holidayDates(y, A.agreement.holidayIds).filter((d, i, arr) => d <= A.meta.periodEnd && arr.indexOf(d) === i);
      const months = Array.from({ length: 12 }, (_, m) => `<span style="left:${pos(`${y}-${String(m + 1).padStart(2, '0')}-01`)}%">${esc(L.month(m))}</span>`).join('');
      tl = `<figure class="tl" aria-label="${esc(s.codesTimeline(`(${T.from})`, `(${T.to})`, T.nFrom, T.nTo, L.date(T.lastFrom), L.date(T.firstTo)))}">
        <div class="tl-track"><span class="tl-sw" style="left:${pos(T.lastFrom)}%;width:${(pos(T.firstTo) - pos(T.lastFrom)).toFixed(2)}%"></span>
        ${(() => { let last = -99, lv = 0; return dates.map((d, i) => { const p = +pos(d); lv = p - last < 2.4 ? lv + 1 : 0; last = p; return `<i class="${i < T.nFrom ? 'a' : 'b'}" style="left:${p}%;bottom:${8 + lv * 13}px" data-tip="${esc(`<b>${esc(L.date(d))}</b><br>(${esc(i < T.nFrom ? T.from : T.to)})`)}"></i>`; }).join(''); })()}
        <span class="tl-now" style="left:${pos(A.meta.periodEnd)}%"></span></div>
        <div class="tl-m">${months}</div>
        <figcaption><span><i class="a"></i>(${esc(T.from)})</span><span><i class="b"></i>(${esc(T.to)})</span><span><i class="sw"></i>${esc(s.tlSwitch)}</span><span><i class="now"></i>${esc(s.tlToday)}</span></figcaption></figure>
        <p class="callout">${esc(s.codesTimeline(`(${T.from})`, `(${T.to})`, T.nFrom, T.nTo, L.date(T.lastFrom), L.date(T.firstTo)))}</p>`;
    }
    const catLbl = (c) => s.cat[c] || L.kind(c);
    const rows = A.codes.map((c) => `<div class="cd ${c.current ? 'now' : ''}"><span class="cc">(${esc(c.code)})</span><span class="cu">${esc(c.cats.map(catLbl).join(', '))}${c.avgRegRate ? `<small>${esc(s.avgRate)}: ${esc(L.money(c.avgRegRate))}</small>` : ''}</span><span class="num">${c.curHours ? esc(L.h(c.curHours)) : '—'}</span><span class="num">${esc(L.h(c.ytdHours))}</span></div>`).join('');
    return card('g-codes', s.h.codes, `<p class="lead">${esc(s.codesMeaning(firsts))}</p>${tl}
      <div class="codes"><div class="cd hd"><span>${esc(s.codeCol)}</span><span>${esc(s.usedFor)}</span><span class="num">${esc(s.thisPay)}</span><span class="num">${esc(s.thisYear)}</span></div>${rows}</div>
      <p class="note">${esc(s.codesConfirm)}</p>`, { intro: esc(PD.agText(A.agreement, L.lang, 'codesIntro') || s.codesIntro) });
  }
  function labelsCard(A, L) {
    const s = L.s;
    const how = `<ul class="bul">${s.readHow.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`;
    let map = '';
    if (A.labelMap.length) {
      const RS = PD.ROLE_SHORT[L.lang];
      const loose = (x) => PD.key(x).split(/\s+/).map((w) => w.replace(/s$/, '')).join(' ');
      const sumRow = A.summary.columns.length ? `<div class="lm"><div class="lm-o"><b>${A.summary.columns.map((c) => `“${esc(c.label)}”`).join(', ')}</b></div><span class="lm-ar">${I.arrow}</span><div class="lm-r">${esc(s.summaryRow(A.summaryRoles.map((r) => RS[r]).join(', ')))}</div></div>` : '';
      const rows = A.labelMap.map((m) => {
        const wd = PD.WD_NAMES[m.role] || ['', ''];
        const same = loose(m.original) === loose(wd[1]) || loose(m.original) === loose(wd[0]);
        return `<div class="lm ${same ? '' : 'bad'}"><div class="lm-o"><b>“${esc(m.original)}”</b>${same ? '' : chip(s.notStd, 'warn')}</div><span class="lm-ar">${I.arrow}</span><div class="lm-r">${esc(s.role[m.role])}<small>${esc(s.stdName)}: ${esc(L.lang === 'fr' ? wd[1] : wd[0])}</small></div></div>`;
      }).join('');
      map = `<h3 class="sub">${esc(s.sectionTitles)}</h3><div class="lms">${sumRow}${rows}</div>`;
      if (A.labelMap.some((m) => PD.key(m.original) === 'revenus ou retenues')) map += `<p class="note">${esc(s.revOuRetNote)}</p>`;
    }
    return card('g-labels', s.h.labels, how + map, { intro: esc(s.readIntro) });
  }
  function agreementCard(A, L) {
    const s = L.s, ag = A.agreement, lang = L.lang;
    if (!ag) return card('g-agreement', s.h.agreement, `<p class="lead">${esc(s.noAgreement)}</p>`);
    const sc = PD.scaleFor(ag, A.meta.periodStart || A.meta.payDate);
    const hits = new Set((A.rateMatches || []).filter((r) => r.hit).map((r) => r.hit.cls + r.hit.level));
    const grid = sc ? `<h3 class="sub">${esc(s.scaleTitle(L.date(sc.from)))}</h3><div class="wg"><div class="wg-r hd"><span>${esc(s.cls)}</span><span class="num">A</span><span class="num">B</span><span class="num">C</span></div>
      ${Object.entries(sc.rates).map(([c, r]) => `<div class="wg-r ${['A', 'B', 'C'].some((lv) => hits.has(c + lv)) ? 'on' : ''}"><span><b>${esc(s.cls)} ${c}</b><small>${esc((ag.jobs[c] || []).join(', '))}</small></span>${['A', 'B', 'C'].map((lv) => `<span class="num ${hits.has(c + lv) ? 'hl' : ''}">${esc(L.money(r[lv]))}</span>`).join('')}</div>`).join('')}</div>
      <p class="note">${esc(s.scaleNote)}</p>` : '';
    const F = (ag.facts && (ag.facts[lang] || ag.facts.en)) || [];
    const facts = `<h3 class="sub">${esc(s.facts)}</h3><div class="facts">${F.map(([v, k, a]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span><small>${esc(a)}</small></div>`).join('')}</div>`;
    const vac = `<h3 class="sub">${esc(s.vacTable)} (${esc(PD.agText(ag, lang, 'vacRef'))})</h3><div class="vt"><div class="vt-r hd"><span>${esc(s.service)}</span><span>${esc(s.length)}</span><span class="num">${esc(s.pctPay)}</span></div>${ag.vacation.map((v) => `<div class="vt-r"><span>${esc(v.svc[lang])}</span><span>${esc(v.len[lang])}</span><span class="num">${esc(L.pct(v.pct, 1))}</span></div>`).join('')}</div>`;
    const y = A.meta.year || 2026, hd = PD.holidayDates(y, ag.holidayIds);
    const hol = `<h3 class="sub">${esc(s.holidaysTitle(ag.holidays[lang].length, y))} (${esc(PD.agText(ag, lang, 'holidaysRef'))})</h3><ol class="holi">${ag.holidays[lang].map((h, i) => { const clash = hd.indexOf(hd[i]) !== i; return `<li class="${hd[i] && hd[i] <= (A.meta.periodEnd || '') ? 'past' : ''}"><span class="hd">${clash ? '—' : esc(L.dateS(hd[i]))}</span><span>${esc(h)}${clash ? `<small>${esc(s.holClash)}</small>` : ''}</span></li>`; }).join('')}</ol>`;
    return card('g-agreement', s.h.agreement, grid + facts + vac + hol + `<p class="note">${esc(PD.agText(ag, lang, 'expires', { date: L.date(ag.expires) }))}</p>`, { intro: esc(PD.agText(ag, lang, 'intro', { title: ag.title[lang], union: ag.union[lang] })) });
  }
  function getPdfCard(L) {
    const s = L.s;
    return card('g-getPdf', s.h.getPdf, `<div class="two in"><div class="howto"><h3>${esc(s.phone)}</h3><ol class="steps">${s.phoneSteps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></div><div class="howto"><h3>${esc(s.computer)}</h3><ol class="steps">${s.computerSteps.map((t) => `<li>${esc(t)}</li>`).join('')}</ol></div></div>
      <p class="note">${esc(s.pdfTip)}</p><div class="cta-row"><button class="btn primary" data-act="open">${I.upload}${esc(s.open)}</button></div>`, { intro: esc(s.getPdfIntro) });
  }

  let measureQueued = false, touching = false;

  /* In-app viewers (Instagram, Messenger) may already keep the page clear of the status bar and home bar
